[package]
name = "rexl"
description = """
Common Library for Rust
"""
keywords = ["argparser", "timeit", "interpolation", "collection"]
categories = ["algorithms", "data-structures", "mathematics"]
readme = "README.md"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include.workspace = true

[features]
default = ["derive"]
derive = ["dep:rexl_macros"]

[dependencies]
rexl_macros = { workspace = true, optional = true }

[dev-dependencies]
chrono = "0.4.42"
